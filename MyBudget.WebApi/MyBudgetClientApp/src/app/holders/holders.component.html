<kendo-grid
  [kendoGridBinding]="data"
  [sortable]="true"
  [resizable]="true"
  [filterable]="true"
  [selectable]="selectableSettings"
  (selectionChange)="selectItem($event)"
>
  <ng-template kendoGridToolbarTemplate>
    <button kendoButton
            themeColor="success"
            fillMode="outline"
            [svgIcon]="plusIcon"
            (click)="onAddClick()"
    >Add
    </button>

    <button kendoButton
            themeColor="info"
            fillMode="outline"
            [disabled]="this.selectedHolder == null"
            [svgIcon]="pencilIcon"
            (click)="onEditClick()"
    >Edit
    </button>

    <button kendoButton
            themeColor="error"
            fillMode="outline"
            [disabled]="this.selectedHolder == null"
            [svgIcon]="trashIcon"
            (click)="onDeleteClick()"
    >Delete
    </button>
  </ng-template>
  <kendo-grid-column field="name" title="Name"></kendo-grid-column>
  <kendo-grid-column field="active" title="Active" filter="boolean"></kendo-grid-column>
</kendo-grid>
